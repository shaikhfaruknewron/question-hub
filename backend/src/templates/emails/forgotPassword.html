<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Your Password</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 30px auto;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .header {
      background-color: #4f46e5;
      color: #ffffff;
      padding: 24px;
      text-align: center;
    }
    .header h1 {
      margin: 0;
      font-size: 24px;
    }
    .content {
      padding: 32px;
      color: #334155;
      line-height: 1.6;
    }
    .btn-container {
      text-align: center;
      margin: 30px 0;
    }
    .btn {
      background-color: #4f46e5;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 6px;
      font-weight: 600;
      display: inline-block;
    }
    .footer {
      background-color: #f8fafc;
      padding: 16px;
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
      border-top: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Question Hub</h1>
    </div>
    <div class="content">
      <p>Hello {{name}},</p>
      <p>You requested to reset your password. Click the button below to set a new password:</p>
      <div class="btn-container">
        <a href="{{resetLink}}" class="btn" target="_blank">Reset Password</a>
      </div>
      <p>This link will expire in {{expiryMinutes}} minutes.</p>
      <p>If you did not request a password reset, please ignore this email.</p>
    </div>
    <div class="footer">
      &copy; {{year}} Question Hub. All rights reserved.
    </div>
  </div>
</body>
</html>
