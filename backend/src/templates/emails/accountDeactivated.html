<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Account Deactivated</title>
</head>
<body style="font-family: Arial, sans-serif; background:#f5f5f5; padding:20px;">

  <div style="max-width:600px; margin:auto; background:white; padding:30px; border-radius:10px;">

    <h2>Hello {{name}},</h2>

    <p>
      Your <strong>Question Hub</strong> account has been
      <span style="color:red;"><strong>deactivated</strong></span>
      by an administrator.
    </p>

    <p>
      If you believe this action was taken by mistake,
      please contact the administrator for assistance.
    </p>

    <br>

    <p>
      Regards,<br>
      <strong>Question Hub Team</strong>
    </p>

    <hr>

    <p style="font-size:12px;color:gray;">
      © {{year}} Question Hub. All rights reserved.
    </p>

  </div>

</body>
</html>
