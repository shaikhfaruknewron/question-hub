name: question-hub

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      # Exposed so you can also browse the data with MongoDB Compass:
      #   mongodb://localhost:27017
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      # Plain mongodb:// inside the compose network — no SRV lookup, so this
      # works regardless of the host machine's DNS configuration.
      MONGO_URI: mongodb://mongo:27017
      DB_NAME: question-hub
      # Development-only values. Generate real ones for any deployed environment.
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-dev-access-token-secret}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-dev-refresh-token-secret}
      ACCESS_TOKEN_EXPIRY: 15m
      REFRESH_TOKEN_EXPIRY: 7d
      CLIENT_URL: http://localhost:3000
      # Bind mounts don't emit filesystem events on Windows/macOS.
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
  backend-node-modules:
